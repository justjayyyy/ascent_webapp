# Lint, tests (API, shared logic and web app) and the production build on every push and pull request,
# then the browser tests: the built app in Chromium against the real API on a throwaway database.
name: Check

on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ascent_webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ascent_webapp/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: No known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ascent_webapp
    env:
      CI: 'true'
      # Where the throwaway database's MongoDB program is downloaded, so it can be cached between runs
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ascent_webapp/package-lock.json
      - run: npm ci
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: MongoDB binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('ascent_webapp/package-lock.json') }}
      - run: npm run test:e2e
      - name: Report and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ascent_webapp/playwright-report
            ascent_webapp/test-results
          retention-days: 7
